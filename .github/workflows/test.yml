name: Build and Test

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Build library
        run: ./gradlew :universal_components:assembleRelease --continue --console=plain --no-daemon

      - name: Run lint
        run: ./gradlew :universal_components:lint --continue --console=plain --no-daemon

      - name: Run unit tests
        run: ./gradlew clean :universal_components:test --continue --console=plain --no-daemon

#      - name: Generate test coverage report
#        if: always()
#        run: ./gradlew :universal_components:jacocoTestReport --continue --console=plain --max-workers=1 --no-daemon

