import org.gradle.api.attributes.Category

apply plugin: 'maven-publish'
apply plugin: 'signing'


apply from: rootProject.file('gradle/versioning.gradle')

tasks.register('javadocJar', Jar) {
    dependsOn dokkaHtml
    archiveClassifier = "javadoc"
    from dokkaHtml.outputDirectory
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from android.sourceSets.main.java.source
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = GROUP
            artifactId = POM_ARTIFACT_ID
            version = getVersionName()

            artifact("${layout.buildDirectory.get()}/outputs/aar/${project.getName()}-release.aar")
            artifact sourcesJar
            artifact javadocJar

            pom {
                name = POM_NAME
                packaging = POM_PACKAGING
                description = POM_DESCRIPTION
                url = POM_URL

                licenses {
                    license {
                        name = POM_LICENCE_NAME
                        url = POM_LICENCE_URL
                        distribution = POM_LICENCE_DIST
                    }
                }

                developers {
                    developer {
                        id = POM_DEVELOPER_ID
                        name = POM_DEVELOPER_NAME
                        email = POM_DEVELOPER_EMAIL
                    }
                }

                scm {
                    url = POM_SCM_URL
                    connection = POM_SCM_CONNECTION
                    developerConnection = POM_SCM_DEV_CONNECTION
                }

                withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')

                    def resolvedVersions = [:]
                    project.configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.each { component ->
                        def moduleVersion = component.moduleVersion
                        if (moduleVersion != null) {
                            resolvedVersions["$moduleVersion.group:$moduleVersion.name".toString()] = moduleVersion.version
                        }
                    }

                    project.configurations.implementation.allDependencies.each {
                        if (it.group == null || it.name == null) return

                        def category = it.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
                        if (category != null && category.name in [Category.REGULAR_PLATFORM, Category.ENFORCED_PLATFORM]) return

                        def version = it.version ?: resolvedVersions["$it.group:$it.name".toString()]
                        if (version == null) return

                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', it.group)
                        dependencyNode.appendNode('artifactId', it.name)
                        dependencyNode.appendNode('version', version)
                    }
                }
            }
        }
    }
}

signing {
    def signingKey = System.getenv("SIGNING_KEY")
    def signingPassword = System.getenv("SIGNING_PASSWORD")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications
}


publish.dependsOn build
tasks.named('signReleasePublication').configure {
    dependsOn 'bundleReleaseAar'
}
